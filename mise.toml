[tools]
go = "1.26.1"

[env]
GORELEASER_CROSS_IMAGE = "ghcr.io/goreleaser/goreleaser-cross:v1.25.9"

[tasks.run]
description = "Run the lazygh CLI from source"
raw = true
run = "go run ./cmd/lazygh"

[tasks.install]
description = "Install the lazygh binary into ./bin"
run = "mkdir -p ./bin && GOBIN=$(pwd)/bin go install ./cmd/lazygh"

[tasks.lazygh]
description = "Install and run the lazygh binary from ./bin"
raw = true
run = [
  "mkdir -p ./bin && GOBIN=$(pwd)/bin go install ./cmd/lazygh",
  "./bin/lazygh",
]

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks.coverage]
description = "Run the Go test suite with coverage output"
raw = true
run = "mkdir -p .sandbox/coverage && go test ./... -coverprofile=.sandbox/coverage/coverage.out && go tool cover -func=.sandbox/coverage/coverage.out | tail -n 1"

[tasks.build]
description = "Build the lazygh binary"
run = "mkdir -p bin && go build -o ./bin/lazygh ./cmd/lazygh"

[tasks.fmt]
description = "Format Go source files"
run = "gofmt -w ."

[tasks.tidy]
description = "Tidy Go module files"
run = "go mod tidy"

[tasks.release-check]
description = "Validate the GoReleaser configuration"
raw = true
run = "docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -e GOCACHE=/tmp/go-build -e GOMODCACHE=/tmp/go-mod -v \"$(pwd)\":/work -w /work \"$GORELEASER_CROSS_IMAGE\" check --config .goreleaser.yaml"

[tasks.release-snapshot]
description = "Build release archives locally without publishing"
raw = true
run = "docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -e GOCACHE=/tmp/go-build -e GOMODCACHE=/tmp/go-mod -v \"$(pwd)\":/work -w /work \"$GORELEASER_CROSS_IMAGE\" release --snapshot --clean --skip=publish --config .goreleaser.yaml"
